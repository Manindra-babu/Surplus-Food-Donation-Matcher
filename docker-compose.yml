services:
  foodbridge-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodbridge-ai-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PRODUCT_NAME=FoodBridge AI
    volumes:
      - foodbridge-data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  foodbridge-data:
